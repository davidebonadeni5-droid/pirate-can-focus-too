name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests et APK de debug
        run: ./gradlew :app:testDebugUnitTest :app:desktopTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pirate-focus-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  ios:
    name: iPhone (simulateur)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Générer le projet Xcode
        run: |
          brew install xcodegen
          cd iosApp && xcodegen
      - name: Compiler l'app iPhone
        run: |
          xcodebuild -project iosApp/PirateFocus.xcodeproj -scheme PirateFocus -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
